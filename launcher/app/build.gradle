plugins {
    id 'com.android.application'
}

// Release signing comes only from keystore.properties or the environment. Without all four values a
// release build stops with a clear message: it must never fall back to the debug key.
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def signingValue = { String key, String env -> signing.getProperty(key) ?: System.getenv(env) }
def signingKeys = [storeFile: 'LEIOS_STORE_FILE', storePassword: 'LEIOS_STORE_PASSWORD',
                   keyAlias: 'LEIOS_KEY_ALIAS', keyPassword: 'LEIOS_KEY_PASSWORD']
def signingMissing = signingKeys.findAll { key, env -> !signingValue(key, env) }.collect { key, env -> "$key ($env)" }
def releaseStore = signingValue('storeFile', 'LEIOS_STORE_FILE')
if (releaseStore && !file(releaseStore).exists()) signingMissing << 'storeFile: no keystore at that path'
def canSignRelease = signingMissing.isEmpty()

// Online title search (TMDB): the key comes only from launcher/tmdb.properties (untracked) or the
// TMDB_API_KEY environment variable. Without one, the app builds with online search hidden.
def tmdb = new Properties()
def tmdbFile = rootProject.file('tmdb.properties')
if (tmdbFile.exists()) tmdbFile.withInputStream { tmdb.load(it) }
def tmdbKey = (tmdb.getProperty('tmdbApiKey') ?: System.getenv('TMDB_API_KEY') ?: '').trim()
if (!(tmdbKey ==~ /[A-Za-z0-9._-]*/)) throw new GradleException('tmdb.properties: tmdbApiKey has characters a TMDB key never has.')

gradle.taskGraph.whenReady { graph ->
    def releaseOutput = graph.allTasks.any { t ->
        t.project == project && t.name ==~ /(assemble|bundle|package)Release/
    }
    if (releaseOutput && !canSignRelease) {
        throw new GradleException("Release signing isn't set up, so no release was built.\n"
                + "Missing: ${signingMissing.join(', ')}.\n"
                + "Copy launcher/keystore.properties.example to launcher/keystore.properties and fill it in, "
                + "or set the LEIOS_* environment variables. Debug builds don't need this.")
    }
}

android {
    namespace 'tv.leios.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.leios.launcher'
        // Android 9: ImageDecoder and animated backgrounds need it; Android TV devices still in use have it.
        minSdk 28
        targetSdk 34
        versionCode 5
        versionName '1.3'
        buildConfigField 'String', 'TMDB_KEY', "\"${tmdbKey}\""
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(releaseStore)
                storePassword signingValue('storePassword', 'LEIOS_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'LEIOS_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'LEIOS_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Every language stays in the app: Leios can have its own language (Android 13+ app languages),
    // so one the TV itself doesn't use must still be there when it's picked.
    bundle {
        language {
            enableSplit false
        }
    }

    buildTypes {
        // -Ppseudo: a test build with Android's pseudo-languages (Settings shows "English (XA)",
        // long accented text, and "Arabic (XB)", mirrored), to check text fits and layouts mirror.
        // Never for a published build.
        debug {
            pseudoLocalesEnabled project.hasProperty('pseudo')
        }
        release {
            pseudoLocalesEnabled project.hasProperty('pseudo')
            // Smaller and faster.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Android classes in unit tests return defaults instead of throwing (Base64 etc. are avoided).
        unitTests.returnDefaultValues = true
    }

    lint {
        // Errors stop the build; warnings are reported only.
        abortOnError true
        checkReleaseBuilds false
        // Translation-ready: no text outside res/values/strings*.xml, placeholders that match,
        // plurals for counts, and layouts that mirror for right-to-left languages.
        error 'HardcodedText', 'SetTextI18n', 'StringFormatInvalid', 'StringFormatMatches', 'StringFormatCount',
                'PluralsCandidate', 'RtlHardcoded', 'RtlSymmetry', 'RtlCompat', 'RtlEnabled',
                'MissingQuantity', 'UnusedQuantity', 'ImpliedQuantity', 'Typos'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for tests (Android's is only a stub on the JVM).
    testImplementation 'org.json:json:20231013'
    // A real XML pull parser for the icon-pack tests (Android's is only a stub on the JVM).
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
