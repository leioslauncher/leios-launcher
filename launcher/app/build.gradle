plugins {
    id 'com.android.application'
}

// Release signing comes only from keystore.properties or the environment. Without them a release
// build stays unsigned: it must never fall back to the debug key.
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def signingValue = { String key, String env -> signing.getProperty(key) ?: System.getenv(env) }
def releaseStore = signingValue('storeFile', 'LEIOS_STORE_FILE')

android {
    namespace 'tv.leios.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.leios.launcher'
        // Android 9: ImageDecoder and animated backgrounds need it; Android TV devices still in use have it.
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword signingValue('storePassword', 'LEIOS_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'LEIOS_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'LEIOS_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Smaller and faster.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Android classes in unit tests return defaults instead of throwing (Base64 etc. are avoided).
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for tests (Android's is only a stub on the JVM).
    testImplementation 'org.json:json:20231013'
    // A real XML pull parser for the icon-pack tests (Android's is only a stub on the JVM).
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
