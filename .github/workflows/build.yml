# Builds the debug APK and runs the unit tests and Lint on every push.
# No signing keys are used here: release builds are signed only on the maintainer's PC.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Checks the Gradle wrapper against Gradle's official checksums and caches downloads.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
