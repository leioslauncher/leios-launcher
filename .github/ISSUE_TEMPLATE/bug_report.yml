name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove personal details from text and screenshots, such as your Wi-Fi name, IP address or city. Report security problems privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: JMGO N3 4K, Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
